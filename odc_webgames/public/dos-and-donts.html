<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maker Manners — Do or Don't</title>
  <link rel="stylesheet" href="/dos-and-donts.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Maker Manners — The Etiquette Challenge</h1>
      <a href="/" style="text-decoration:none;color:#555;">Back</a>
    </header>

    <div class="card">
      <div id="scenario" class="scenario"></div>
      <div class="buttons">
        <button id="btnPolite" class="btn ok">Polite ✅</button>
        <button id="btnRude" class="btn wrong">Rude ❌</button>
      </div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <div class="progress" id="progress"></div>
      <div id="final" class="result" style="display:none"></div>
    </div>
  </div>

  <script src="/dos-and-donts.js"></script>
</body>
</html>
