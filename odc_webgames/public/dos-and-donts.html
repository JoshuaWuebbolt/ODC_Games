<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Do's and Don'ts</title>
    <link rel="stylesheet" href="/dos-and-donts.css" />
  </head>
  <body>
    <main class="container">
      <h1>Do's and Don'ts</h1>

      <section class="panel">
        <h2>Do</h2>
        <ul id="do-list">
          <li>Keep materials clean</li>
          <li>Follow the safety guidelines</li>
          <li>Use recommended settings</li>
        </ul>
      </section>

      <section class="panel">
        <h2>Don't</h2>
        <ul id="dont-list">
          <li>Force the machine</li>
          <li>Use incompatible materials</li>
          <li>Leave the device unattended while running</li>
        </ul>
      </section>

      <div class="actions">
        <button id="highlight-do">Highlight Do's</button>
        <button id="highlight-dont">Highlight Don'ts</button>
        <button id="reset">Reset</button>
      </div>

      <footer class="foot">
        <p><a href="/">Return to app</a></p>
      </footer>
    </main>

    <script src="/dos-and-donts.js"></script>
  </body>
</html>
